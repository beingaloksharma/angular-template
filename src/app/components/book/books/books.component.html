<div *ngIf="loading ;else elseBlock">
    <app-spinner></app-spinner>
</div>
<ng-template #elseBlock>
    <div class="center">
        <mat-card class="card">
            <mat-card-header>
                <div class="table mt-2">
                    <span>
                        <button mat-fab extended color="primary" class="pull-right" aria-label="Home"
                            [routerLink]="['/books/create']">
                            <mat-icon style="padding:0">note_add</mat-icon> New Book Record
                        </button>
                    </span>
                </div>
                <mat-card-title>
                    <section>
                        <div class="example-button-row">
                            <div class="example-flex-container">
                                <div class="example-button-container">
                                    <div class="example-button-container">
                                        <button mat-fab color="primary" aria-label="Home" [routerLink]="['/books']">
                                            <mat-icon>home</mat-icon>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="example-label">
                            <button mat-button color="accent" aria-disabled="true" tabindex="-1">
                                <h1>Books</h1>
                            </button>
                        </div>
                    </section>
                    <mat-divider></mat-divider>
                </mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <mat-form-field>
                    <mat-label>Filter</mat-label>
                    <input matInput (keyup)="applyFilter($event)" placeholder="Search " #input>
                </mat-form-field>
                <div class="mat-elevation-z8">
                    <table mat-table [dataSource]="dataSource" matSort>
                        <!-- Id Column -->
                        <ng-container matColumnDef="id">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Id </th>
                            <td mat-cell *matCellDef="let row">
                                {{row.id }}
                            </td>
                        </ng-container>
                        <!-- Book Name Column -->
                        <ng-container matColumnDef="name">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
                            <td mat-cell *matCellDef="let row">
                                {{row.name }}
                            </td>
                        </ng-container>
                        <!-- Author Name Column -->
                        <ng-container matColumnDef="author_name">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Author Name </th>
                            <td mat-cell *matCellDef="let row">
                                {{row.author_name}}
                            </td>
                        </ng-container>
                        <!-- Pulication Column -->
                        <ng-container matColumnDef="publication">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Publication </th>
                            <td mat-cell *matCellDef="let row">
                                {{row.publication}}
                            </td>
                        </ng-container>
                        <!-- Edition Column -->
                        <ng-container matColumnDef="edition">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Edition </th>
                            <td mat-cell *matCellDef="let row">
                                {{row.edition}}
                            </td>
                        </ng-container>
                        <!-- Publication Date Column -->
                        <ng-container matColumnDef="publication_date">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Publication Date </th>
                            <td mat-cell *matCellDef="let row">
                                {{row.publication_date | date:'longDate'}}
                            </td>
                        </ng-container>
                        <!-- Language Column -->
                        <ng-container matColumnDef="language">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Language </th>
                            <td mat-cell *matCellDef="let row">
                                <span class="mt-2 badge rounded-pill bg-primary border border-success"
                                    *ngFor="let lang of row.language">
                                    {{lang.language}}
                                </span>
                            </td>
                        </ng-container>
                        <!-- Status Column -->
                        <ng-container matColumnDef="status">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> status </th>
                            <td mat-cell *matCellDef="let row">
                                <button mat-raised-button color="primary"
                                    *ngIf="row.status == 'Active' ">{{row.status}}</button>
                                <button mat-raised-button color="accent"
                                    *ngIf="row.status == 'Delete' ">{{row.status}}</button>
                            </td>
                        </ng-container>
                        <!-- Action Column -->
                        <ng-container matColumnDef="action">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Action </th>
                            <td mat-cell *matCellDef="let row">
                                <i class="fa fa-eye p-2 zoom" [hidden]="row.status == 'Delete'"
                                    [routerLink]="['/books/book', row.id]" style="color:green"></i>
                                <i class="fa fa-edit p-2 zoom" [hidden]="row.status == 'Delete'" style="color:blue"></i>
                                <i class="fa fa-trash p-2 zoom" (click)="UpdateBookStatus(row.id, 'Delete')"
                                    [hidden]="row.status == 'Delete'" style="color:red"></i>
                                <i class="fa fa-reply p-2 zoom" (click)="UpdateBookStatus(row.id, 'Active')"
                                    [hidden]="row.status != 'Delete'" style="color:crimson"></i>
                            </td>
                        </ng-container>
                        <!-- Columns -->
                        <tr mat-header-row *matHeaderRowDef="displayedColumns;sticky: true"></tr>
                        <!-- Row data -->
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                        <!-- Row shown when there is no matching data. -->
                        <tr class="mat-row" *matNoDataRow>
                            <td class="mat-cell text-center" style="margin-top: 5%;" colspan="6"> No Data Found </td>
                        </tr>
                    </table>
                    <mat-paginator [length]="100" [pageSize]="10" [pageSizeOptions]="[10,50,100]"
                        aria-label="Select page">
                    </mat-paginator>
                </div>
            </mat-card-content>
        </mat-card>
    </div>
</ng-template>
