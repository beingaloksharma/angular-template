<div *ngIf="loading">
  <app-spinner></app-spinner>
</div>

<div class="center">
  <div class="auth-container">
    <mat-card class="auth-card">
      <div class="auth-header">
        <div class="auth-brand">
          <mat-icon>auto_stories</mat-icon>
        </div>
        <h1>Welcome Back</h1>
        <p>Sign in to your multi-tenant portal</p>
      </div>

      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="login()">
          <div class="form-group mb-3">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Username or Email</mat-label>
              <input matInput placeholder="e.g. john or john@example.com" formControlName="user_name">
              <mat-icon matSuffix class="text-muted">account_circle</mat-icon>
              <mat-error *ngIf="loginForm.get('user_name')?.hasError('required')">
                Username or Email is required
              </mat-error>
            </mat-form-field>
          </div>

          <div class="form-group mb-3">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Password</mat-label>
              <input matInput [type]="hide ? 'password' : 'text'" placeholder="Enter your password" formControlName="password">
              <button type="button" mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'">
                <mat-icon class="text-muted">{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
              </button>
              <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
                Password is required
              </mat-error>
            </mat-form-field>
          </div>

          <button mat-raised-button color="primary" type="submit" class="w-100 mt-2" [disabled]="loginForm.invalid">
            Sign In
          </button>
        </form>

        <div class="auth-links">
          <a routerLink="../signup">New organization? Create an account</a>
          <a routerLink="../forgot-password">Forgot your password?</a>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
