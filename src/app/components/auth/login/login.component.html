<div *ngIf="loading">
  <app-spinner></app-spinner>
</div>

<div class="auth-centered-page">
  <div class="auth-card-wrapper">
    <mat-card class="modern-auth-card">
      <!-- Card Brand & Title -->
      <div class="auth-card-header">
        <div class="auth-brand-logo">
          <mat-icon>auto_stories</mat-icon>
        </div>
        <h1 class="auth-card-title">Welcome Back</h1>
        <p class="auth-card-subtitle">Sign in to your account</p>
      </div>

      <!-- Login Form -->
      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <div class="form-group mb-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Username or Email</mat-label>
            <input matInput placeholder="e.g. alok or user@example.com" formControlName="user_name" autocomplete="username">
            <mat-icon matSuffix class="text-muted">account_circle</mat-icon>
            <mat-error *ngIf="loginForm.get('user_name')?.hasError('required')">
              Username or Email is required
            </mat-error>
          </mat-form-field>
        </div>

        <div class="form-group mb-2">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Password</mat-label>
            <input matInput [type]="hide ? 'password' : 'text'" placeholder="Enter your password" formControlName="password" autocomplete="current-password">
            <button type="button" mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'">
              <mat-icon class="text-muted">{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
            <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
              Password is required
            </mat-error>
          </mat-form-field>
        </div>

        <div class="auth-forgot-row">
          <a routerLink="../forgot-password" class="auth-link">Forgot password?</a>
        </div>

        <button mat-raised-button type="submit" class="btn-auth-primary" [disabled]="loginForm.invalid">
          Sign In
        </button>
      </form>

      <!-- Bottom Switch Link -->
      <div class="auth-card-footer">
        <span>Don't have an account?</span>
        <a routerLink="../signup">Create Account</a>
      </div>
    </mat-card>
  </div>
</div>
