<div *ngIf="loading">
    <app-spinner></app-spinner>
</div>
<div class="center">
    <div class="auth-container">
        <mat-card>
            <mat-card-header class="auth-header">
                <mat-card-title>
                    <h1>Welcome Back</h1>
                </mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <form [formGroup]="loginForm" (ngSubmit)="login()">
                    <div class="row">
                        <mat-form-field appearance="outline">
                            <mat-label>Username or Email</mat-label>
                            <input matInput placeholder="Enter your username or email" formControlName="user_name">
                            <mat-icon matSuffix>person</mat-icon>
                            <mat-error *ngIf="loginForm.get('user_name')?.hasError('required')">
                                Username or Email is required
                            </mat-error>
                        </mat-form-field>
                    </div>
                    <div class="row">
                        <mat-form-field appearance="outline">
                            <mat-label>Password</mat-label>
                            <input matInput [type]="hide ? 'password' : 'text'" placeholder="Enter your password"
                                formControlName="password">
                            <button type="button" mat-icon-button matSuffix (click)="hide = !hide"
                                [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
                                <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                            </button>
                            <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
                                Password is required
                            </mat-error>
                        </mat-form-field>
                    </div>

                    <div class="row mt-3">
                        <button mat-raised-button color="primary" type="submit" class="w-100">
                            Log In
                        </button>
                    </div>
                </form>

                <div class="auth-links">
                    <a routerLink="../signup">Don't have an account? Register here</a>
                    <a routerLink="../forgot-password">Forgot Password?</a>
                </div>
            </mat-card-content>
        </mat-card>
    </div>
</div>
