<div *ngIf="loading">
  <app-spinner></app-spinner>
</div>

<div class="center">
  <div class="auth-container">
    <mat-card class="auth-card">
      <div class="auth-header">
        <div class="auth-brand">
          <mat-icon>lock_reset</mat-icon>
        </div>
        <h1>Reset Password</h1>
        <p>Set a new password for your tenant account</p>
      </div>

      <mat-card-content>
        <form [formGroup]="forgotForm" (ngSubmit)="forgotPassword()">
          <div class="form-group mb-3">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Username or Email</mat-label>
              <input matInput placeholder="Enter your registered username or email" formControlName="user_name">
              <mat-icon matSuffix class="text-muted">account_circle</mat-icon>
              <mat-error *ngIf="forgotForm.get('user_name')?.hasError('required')">
                Username or Email is required
              </mat-error>
            </mat-form-field>
          </div>

          <div class="form-group mb-3">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>New Password</mat-label>
              <input matInput [type]="hide ? 'password' : 'text'" placeholder="Enter new password" formControlName="password">
              <button type="button" mat-icon-button matSuffix (click)="hide = !hide">
                <mat-icon class="text-muted">{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
              </button>
              <mat-error *ngIf="forgotForm.get('password')?.hasError('required')">
                Password is required
              </mat-error>
            </mat-form-field>
          </div>

          <div class="form-group mb-3">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Confirm New Password</mat-label>
              <input matInput [type]="hide ? 'password' : 'text'" placeholder="Confirm new password" formControlName="confirm_password">
              <button type="button" mat-icon-button matSuffix (click)="hide = !hide">
                <mat-icon class="text-muted">{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
              </button>
              <mat-error *ngIf="forgotForm.get('confirm_password')?.hasError('required')">
                Confirm Password is required
              </mat-error>
              <mat-error *ngIf="forgotForm.get('confirm_password')?.hasError('mismatch')">
                Passwords do not match
              </mat-error>
            </mat-form-field>
          </div>

          <button mat-raised-button color="primary" type="submit" class="w-100 mt-2" [disabled]="forgotForm.invalid">
            Update Password
          </button>
        </form>

        <div class="auth-links">
          <a routerLink="../login">Back to Sign In</a>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
