<div class="center">
    <mat-card class="card">
        <mat-card-header>
            <mat-card-title color="primary">
                <h1>Forgot Password</h1>
            </mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <form [formGroup]="forgotForm" (ngSubmit)="forgotPassword()">
            <div class="row">
                <mat-form-field appearance="outline">
                    <mat-label>Username or Email</mat-label>
                    <input matInput placeholder="Enter Your Username or Email"  formControlName="user_name">
                    <mat-icon matSuffix>supervised_user_circle</mat-icon>
                  </mat-form-field>
            </div>
            <div class="row">
                <mat-form-field appearance="outline">
                    <mat-label>Password</mat-label>
                    <input matInput [type]="hide ? 'password' : 'text'" placeholder="Enter Your Password"  formControlName="password">
                    <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
                      <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                  </mat-form-field>
            </div>
            <div class="row">
                <mat-form-field appearance="outline">
                    <mat-label>Confirm Password</mat-label>
                    <input matInput [type]="hide ? 'password' : 'text'" placeholder="Enter Confirm Your Password"  formControlName="confirm_password">
                    <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
                      <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                  </mat-form-field>
            </div>
            <div class="row">
                <div class="col-sm-4"></div>
                <div class="col-sm-4">
                    <button mat-raised-button color="primary">Ok</button>
                </div>
                <div class="col-sm-4"></div>
            </div>
        </form>
            <div class="row">
                <div class="col-sm-4">
                <a routerLink="../signup">ohh !!!. Register Here</a>
                </div>
                <div class="col-sm-4">
                </div>
                <div class="col-sm-4">
                <a routerLink="../login">ohh !!!. Login Here</a>
                </div>
            </div>
        </mat-card-content>
    </mat-card>
</div>
