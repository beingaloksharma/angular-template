<div class="app-container">
  <!-- Header / Navbar -->
  <header class="navbar-glass">
    <div class="navbar-content">
      <div class="brand-area" [routerLink]="['/books']">
        <div class="brand-icon">
          <mat-icon>auto_stories</mat-icon>
        </div>
        <div class="brand-text">
          <span class="brand-title">WebStarter</span>
          <span class="brand-subtitle">Microservice Platform</span>
        </div>
      </div>

      <nav class="nav-links">
        <a class="nav-item" [routerLink]="['/books']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          <mat-icon>dashboard</mat-icon>
          <span>Dashboard</span>
        </a>
        <a class="nav-item" [routerLink]="['/books/create']" routerLinkActive="active">
          <mat-icon>add_circle_outline</mat-icon>
          <span>New Book</span>
        </a>
      </nav>

      <div class="navbar-spacer"></div>

      <div class="nav-actions">
        <!-- Tenant Badge -->
        <div class="tenant-pill" matTooltip="Active PostgreSQL Tenant Schema" matTooltipPosition="below">
          <span class="tenant-dot"></span>
          <span class="tenant-label">Tenant #{{tenantId}}</span>
        </div>

        <!-- User Profile Pill -->
        <div class="user-pill" (click)="userDetails()" matTooltip="View Profile" matTooltipPosition="below">
          <div class="avatar-badge">
            {{name.charAt(0).toUpperCase()}}
          </div>
          <span class="user-name">{{name}}</span>
        </div>

        <!-- Logout Button -->
        <button mat-icon-button class="btn-logout" (click)="logout()" matTooltip="Logout" aria-label="Sign Out">
          <mat-icon>logout</mat-icon>
        </button>
      </div>
    </div>
  </header>

  <!-- Main View -->
  <main class="main-body">
    <div class="container-xl">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <div class="footer-content">
      <p>&copy; 2026 WebStarter Multi-Tenant Application. Designed with Angular &amp; Go.</p>
    </div>
  </footer>
</div>
