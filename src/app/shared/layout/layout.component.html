<div class="app-container">
    <mat-toolbar color="primary" class="main-toolbar">
        <span class="logo" [routerLink]="['/books']">
            <mat-icon class="logo-icon">library_books</mat-icon>
            Library App
        </span>

        <span class="spacer"></span>

        <span class="welcome-msg">
            Welcome, <strong>{{name}}</strong>
        </span>

        <!-- Home -->
        <button mat-icon-button aria-label="Home" [routerLink]="['/books']" matTooltip="Home">
            <mat-icon>home</mat-icon>
        </button>

        <!-- Profile -->
        <button mat-icon-button aria-label="Profile" (click)="userDetails()" matTooltip="My Profile">
            <mat-icon>account_circle</mat-icon>
        </button>

        <!-- Logout -->
        <button mat-icon-button aria-label="Logout" (click)="logout()" matTooltip="Logout">
            <mat-icon>power_settings_new</mat-icon>
        </button>
    </mat-toolbar>

    <main class="content-wrapper">
        <router-outlet></router-outlet>
    </main>

    <footer class="app-footer">
        <p>
            &copy; 2023 Angular Template. All rights reserved.
        </p>
    </footer>
</div>
